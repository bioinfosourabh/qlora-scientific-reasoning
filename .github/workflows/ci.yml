name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU only; no torch)
        run: pip install -r requirements-cpu.txt && pip install -e .
      - name: Tests
        run: pytest -v
      - name: Notebook is valid JSON
        run: python -c "import json; json.load(open('notebooks/Scientific_Reasoning_Assistant_Colab.ipynb'))"
