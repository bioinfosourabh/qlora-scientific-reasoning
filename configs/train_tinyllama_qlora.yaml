# QLoRA fine-tuning of TinyLlama-1.1B-Chat for a free Colab T4 (16 GB).
# Values follow the original notebook; epochs and replication were raised after the first
# run, where the model still continued the paper text instead of answering.

model:
  base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  max_seq_length: 1024            # longer examples are skipped, not truncated

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: float16 # T4 has no bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj]

data:
  examples: data/examples.json
  val_fraction: 0.15
  replicate: 10                   # repeats of the training set per epoch (small dataset)

training:
  output_dir: outputs/sci-reasoning-assistant
  num_train_epochs: 10
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  fp16: true
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 1
  eval_strategy: epoch
  report_to: none
  seed: 42
